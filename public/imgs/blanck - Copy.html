<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed | Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #919DA7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
      overflow-x: hidden;
      /* مهم عشان الصور اللي طالعة من الجنب */
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.5px;
    }

    header p {
      color: #666;
      margin-top: 8px;
      font-size: 1rem;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* ===== Rows with 3 images ===== */
    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* ===== Middle row - 4 images with overflow effect ===== */
    .row-4-wrapper {
      width: 100%;
      /* overflow: hidden; */
      /* بيخفي الجزء الزيادة من اليمين والشمال */
      position: relative;
    }

    .profile-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 7px 18px 7px 8px;
      background: #ffffff;
      border: 2px solid #8F9BA5;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
      transform: translate(-50%, -50%);
    }

    .profile-badge img {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border: 2px solid #8F9BA5;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      color: #111820;
      white-space: nowrap;
    }

    .profile-role {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .profile-phone {
      color: #000000;
      font-size: 0.85rem;
      direction: ltr;
      text-decoration: none;
      font-weight: bold;
    }

    .row-4 {
      display: flex;
      gap: 28px;
      width: max-content;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 0;
    }

    .row-4 .card {
      flex: 0 0 calc((min(1400px, 100vw - 40px) - 56px) / 3);
    }

    /* ===== Card Style ===== */
    .card {
      /* background: #ffffff; */
      border-radius: 8px;
      overflow: hidden;
      /* box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); */
      border: 6px solid #C7CDD2;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      aspect-ratio: 16 / 10;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .row-4 {
        gap: 20px;
      }
    }

    @media (max-width: 700px) {
      .row-3 {
        grid-template-columns: 1fr;
      }

      .row-4 {
        width: 100%;
        left: 0;
        transform: none;
        flex-wrap: wrap;
        justify-content: center;
      }

      .row-4 .card {
        flex: 0 0 100%;
        max-width: 100%;
      }

      .profile-badge {
        gap: 8px;
        padding-right: 12px;
      }

      .profile-badge img {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .profile-role {
        font-size: 0.82rem;
      }

      .profile-phone {
        font-size: 0.72rem;
      }

      body {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="gallery">
      <!-- Row 1 - 3 images -->
      <div class="row-3">
        <div class="card">
          <img src="gallery-43II.png" alt="Gallery 01">
        </div>
        <div class="card">
          <img src="gallery-40.webp" alt="Gallery 02">
        </div>
        <div class="card">
          <img src="gallery-42II.png" alt="Gallery 03">
        </div>
      </div>
      <!-- Row 2 - 4 images (Centered + Half hidden on sides) -->
      <div class="row-4-wrapper">
        <div class="row-4">
          <div class="card">
            <img src="gallery-48.webp" alt="Gallery 04">
          </div>
          <div class="card">
            <img src="gallery-31.webp" alt="Gallery 05">
          </div>
          <div class="card">
            <img src="gallery-44.webp" alt="Gallery 06">
          </div>
          <div class="card">
            <img src="gallery-36.webp" alt="Gallery 07">
          </div>
        </div>
        <div class="profile-badge">
          <img src="3eznaL.png" alt="Ahmed">
          <div class="profile-details">
            <h3>Ahmed Eweis</h3>
            <span class="profile-role">Web Developer</span>
            <a class="profile-phone" href="https://wa.me/201153161437">WhatsApp:+201153161437</a>
          </div>
        </div>
      </div>
      <!-- Row 3 - 3 images -->
      <div class="row-3">
        <div class="card">
          <img src="gallery-25.webp" alt="Gallery 08">
        </div>
        <div class="card">
          <img src="gallery-31II.webp" alt="Gallery 09">
        </div>
        <div class="card">
          <img src="gallery-47.webp" alt="Gallery 10">
        </div>
      </div>
    </div>
  </div>
</body>

</html>
